<!DOCTYPE html>
<html>
<head>
    <title>简单测试</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        input { padding: 10px; width: 70%; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; cursor: pointer; }
        .log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; font-family: monospace; font-size: 12px; height: 300px; overflow-y: auto; }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>简单测试</h1>
    
    <input type="text" id="msgInput" value="你好" placeholder="输入消息">
    <button id="sendBtn">发送</button>
    
    <div class="log" id="log"></div>

    <script>
        const msgInput = document.getElementById('msgInput');
        const sendBtn = document.getElementById('sendBtn');
        const logDiv = document.getElementById('log');
        
        let ws = null;

        function log(msg, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        function connect() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/`;
            log('连接WebSocket: ' + wsUrl);
            
            ws = new WebSocket(wsUrl);

            ws.onopen = () => log('✅ WebSocket连接成功', 'success');
            
            ws.onmessage = (e) => {
                log('收到消息: ' + e.data.substring(0, 100), 'success');
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'stream') {
                        log('AI回复: ' + data.content, 'success');
                    }
                } catch (err) {
                    log('解析失败: ' + err.message, 'error');
                }
            };

            ws.onclose = () => log('WebSocket关闭', 'error');
            ws.onerror = (e) => log('WebSocket错误: ' + e.message, 'error');
        }

        sendBtn.addEventListener('click', () => {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('WebSocket未连接', 'error');
                return;
            }
            
            const text = msgInput.value;
            log('发送消息: ' + text);
            
            ws.send(JSON.stringify({
                type: 'chat',
                model: 'Qwen3.5:latest',
                messages: [{ role: 'user', content: text }]
            }));
            
            log('消息已发送', 'success');
        });

        log('页面加载完成');
        connect();
    </script>
</body>
</html>
