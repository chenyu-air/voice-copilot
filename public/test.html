<!DOCTYPE html>
<html>
<head>
    <title>WebSocket测试</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .log { background: #f0f0f0; padding: 10px; margin: 10px 0; border-radius: 5px; font-family: monospace; font-size: 12px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:disabled { background: #ccc; }
    </style>
</head>
<body>
    <h1>🔌 WebSocket连接测试</h1>
    
    <button id="connectBtn">连接WebSocket</button>
    <button id="testBtn" disabled>发送测试消息</button>
    
    <div id="log"></div>

    <script>
        const connectBtn = document.getElementById('connectBtn');
        const testBtn = document.getElementById('testBtn');
        const logDiv = document.getElementById('log');
        
        let ws = null;

        function log(msg, type = 'info') {
            const p = document.createElement('p');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(msg);
        }

        connectBtn.addEventListener('click', () => {
            log('开始连接...', 'info');
            
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/`;
            
            log(`连接地址: ${wsUrl}`, 'info');
            
            try {
                ws = new WebSocket(wsUrl);
                log('WebSocket对象创建成功', 'success');
                
                ws.onopen = () => {
                    log('✅ WebSocket连接成功！', 'success');
                    connectBtn.disabled = true;
                    testBtn.disabled = false;
                };
                
                ws.onclose = (e) => {
                    log(`❌ WebSocket连接关闭，码: ${e.code}, 原因: ${e.reason}`, 'error');
                    connectBtn.disabled = false;
                    testBtn.disabled = true;
                    ws = null;
                };
                
                ws.onerror = (e) => {
                    log(`❌ WebSocket错误: ${e.message || '未知错误'}`, 'error');
                };
                
                ws.onmessage = (e) => {
                    log(`📥 收到消息: ${e.data}`, 'success');
                };
                
            } catch (e) {
                log(`❌ 创建WebSocket失败: ${e.message}`, 'error');
            }
        });

        testBtn.addEventListener('click', () => {
            if (!ws) return;
            
            const testMsg = {
                type: 'chat',
                model: 'Qwen3.5:latest',
                messages: [{ role: 'user', content: '你好' }]
            };
            
            ws.send(JSON.stringify(testMsg));
            log('📤 发送测试消息', 'info');
        });

        log('页面加载完成', 'info');
        log('当前协议: ' + window.location.protocol, 'info');
        log('当前主机: ' + window.location.host, 'info');
    </script>
</body>
</html>
